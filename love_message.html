<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Message</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: pink;
            overflow: hidden;
        }
        h1 {
            font-size: 2.5em;
            color: red;
        }
        p {
            font-size: 1.5em;
            color: white;
        }
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1"></script>
</head>
<body>
    <h1>I love you my love! ❤️</h1>
    <p>See you on Feb 15!</p>
    
    <img src="https://media.tenor.com/Zs9v5RaGm3sAAAAC/cat-clapping.gif" alt="Clapping Cat" width="320" height="240">

    <script>
        function launchConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            setTimeout(launchConfetti, 1000);
        }
        launchConfetti();
    </script>
</body>
</html>
